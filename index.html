  <style>
    /* Minimal loading styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Orbitron', 'Exo 2', 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: #050505;
      background-image:
        radial-gradient(circle at 50% 18%, rgba(255, 59, 31, 0.22) 0%, transparent 44%),
        linear-gradient(to right, rgba(90, 32, 28, 0.22) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(90, 32, 28, 0.16) 1px, transparent 1px),
        linear-gradient(180deg, #050505 0%, #0c0707 100%);
      background-size: auto, 44px 44px, 44px 44px, auto;
      color: #fff3ef;
      line-height: 1.6;
      overflow-x: hidden;
    }
    
    #root {
      min-height: 100vh;
    }
    
    /* Loading animation */
    .loading {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #050505;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(37, 54, 74, 0.9);
      border-top: 3px solid #FF3B1F;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .loading-text {
      margin-top: 1rem;
      font-family: 'IBM Plex Mono', monospace;
      color: #FFB199;
      font-size: 0.9rem;
    }

    @media (prefers-reduced-motion: reduce) {
      .loading-spinner { animation: none; border-top-color: #FF3B1F; }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading">
      <div>
        <div class="loading-spinner"></div>
        <div class="loading-text">CLDCDE.CC</div>
      </div>
    </div>
  </div>
  
  <script type="module" src="./index.js"></script>
</body>
